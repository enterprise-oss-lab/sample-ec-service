[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "order-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "asyncpg==0.30.0",
    "confluent-kafka==2.6.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "PyJWT[crypto]==2.10.1",
    "opentelemetry-sdk==1.31.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.31.0",
    "opentelemetry-instrumentation-fastapi==0.52b0",
    "opentelemetry-instrumentation-asyncpg==0.52b0",
    "opentelemetry-instrumentation-logging==0.52b0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "internal*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
