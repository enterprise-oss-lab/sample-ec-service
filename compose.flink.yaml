services:
  flink-jobmanager:
    build: ./analytics/flink
    image: sample-ec-confirmed-sales:local
    command: standalone-job --job-classname lab.ec.ConfirmedSales
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin # pragma: allowlist secret
      RESTORE_CHECKPOINT: ${RESTORE_CHECKPOINT:-}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        state.checkpoints.num-retained: 3
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 5 s
    ports:
      - "127.0.0.1:28081:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      analytics-namespace-init:
        condition: service_completed_successfully

  flink-taskmanager:
    image: sample-ec-confirmed-sales:local
    command: taskmanager
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin # pragma: allowlist secret
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      - flink-jobmanager

volumes:
  flink-checkpoints:
