name: Notify Multica on PR merge

on:
  pull_request:
    types: [closed]

jobs:
  notify-multica:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify Multica autopilot webhook
        env:
          MULTICA_WEBHOOK_URL: ${{ secrets.MULTICA_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          payload=$(jq -n \
            --arg action "closed" \
            --argjson number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg html_url "$PR_URL" \
            --arg merged_at "$PR_MERGED_AT" \
            --arg merge_commit_sha "$PR_MERGE_COMMIT_SHA" \
            --arg base_ref "$PR_BASE_REF" \
            --arg head_ref "$PR_HEAD_REF" \
            --arg head_sha "$PR_HEAD_SHA" \
            --arg author "$PR_AUTHOR" \
            --arg repo "$REPO_FULL_NAME" \
            '{
              action: $action,
              pull_request: {
                number: $number,
                title: $title,
                html_url: $html_url,
                merged: true,
                merged_at: $merged_at,
                merge_commit_sha: $merge_commit_sha,
                base: { ref: $base_ref },
                head: { ref: $head_ref, sha: $head_sha },
                user: { login: $author }
              },
              repository: { full_name: $repo }
            }')

          curl -fsS -X POST "$MULTICA_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            --data "$payload"
