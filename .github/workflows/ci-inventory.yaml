name: CI - Inventory Service

on:
  push:
    branches: [main]
    paths:
      - "services/**/*.go"
      - "services/**/go.mod"
      - "services/**/go.sum"
      - ".github/workflows/ci-inventory.yaml"
      - "services/inventory/.golangci.yml"
  pull_request:
    paths:
      - "services/**/*.go"
      - "services/**/go.mod"
      - "services/**/go.sum"
      - ".github/workflows/ci-inventory.yaml"
      - "services/inventory/.golangci.yml"

jobs:
  test-inventory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/inventory/go.mod
          cache-dependency-path: services/inventory/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.1
          working-directory: services/inventory
      - name: Download dependencies
        run: go mod download
      - name: Run lint
        run: golangci-lint run ./...
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - name: Run tests
        run: go test ./...
