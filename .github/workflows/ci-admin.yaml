name: CI - Admin

on:
  push:
    branches: [main]
    paths:
      - "frontends/admin/**"
      - ".github/workflows/ci-admin.yaml"
  pull_request:
    paths:
      - "frontends/admin/**"
      - ".github/workflows/ci-admin.yaml"

jobs:
  test-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontends/admin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Run unit tests
        run: pnpm test:run

  test-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontends/admin/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontends/admin/test-results/
          retention-days: 7
