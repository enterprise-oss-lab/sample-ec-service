services:
  zitadel-proxy:
    image: traefik:v3.7.7
    container_name: zitadel-proxy
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sample-ec-service-zitadel
      - --entrypoints.web.address=:80
      - --ping=true
      - --ping.entrypoint=web
      - --api.dashboard=false
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - zitadel
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  zitadel-postgres:
    image: postgres:17.10-alpine
    container_name: zitadel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD:?copy .env.example to .env and set ZITADEL_POSTGRES_PASSWORD}
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zitadel"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
    volumes:
      - zitadel-postgres-data:/var/lib/postgresql/data
    networks:
      - zitadel

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    container_name: zitadel-api
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?copy .env.example to .env and set ZITADEL_MASTERKEY}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:${ZITADEL_POSTGRES_PASSWORD:?copy .env.example to .env and set ZITADEL_POSTGRES_PASSWORD}@zitadel-postgres:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:?copy .env.example to .env and set ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"  # pragma: allowlist secret
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Sample EC bootstrap administrator
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:8080/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:8080/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:8080/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:8080/ui/v2/login/login?samlRequest=
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks:
      - zitadel
    depends_on:
      zitadel-postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=sample-ec-service-zitadel
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      - traefik.http.routers.zitadel-api.rule=Host(`localhost`) && !PathPrefix(`/ui/v2/login`) && !Path(`/`)
      - traefik.http.routers.zitadel-api.entrypoints=web
      - traefik.http.routers.zitadel-api.service=zitadel-api

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.0
    container_name: zitadel-login
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks:
      - zitadel
    depends_on:
      zitadel-api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=sample-ec-service-zitadel
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000
      - traefik.http.middlewares.zitadel-root.replacepath.path=/ui/v2/login/
      - traefik.http.routers.zitadel-root.rule=Host(`localhost`) && Path(`/`)
      - traefik.http.routers.zitadel-root.entrypoints=web
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root
      - traefik.http.routers.zitadel-root.service=zitadel-login
      - traefik.http.routers.zitadel-login.rule=Host(`localhost`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=web
      - traefik.http.routers.zitadel-login.service=zitadel-login

  # The Management API has no declarative bootstrap format for projects and
  # applications.  Keep that setup in a one-shot service so a fresh volume and
  # an already initialised volume behave the same way.
  zitadel-init:
    image: node:24-alpine
    container_name: zitadel-init
    environment:
      ZITADEL_URL: http://zitadel-api:8080
      # Created by ZITADEL's first-instance bootstrap and granted Management
      # API permissions. The login client token is intentionally not used here.
      ZITADEL_PAT_FILE: /zitadel/bootstrap/admin.pat
      ZITADEL_BOOTSTRAP_DIR: /zitadel/bootstrap
      ZITADEL_STOREFRONT_REDIRECT_URI: http://localhost:3001/auth/callback
      ZITADEL_STOREFRONT_LOGOUT_URI: http://localhost:3001/
      ZITADEL_ADMIN_REDIRECT_URI: http://localhost:3002/auth/callback
      ZITADEL_ADMIN_LOGOUT_URI: http://localhost:3002/
      ZITADEL_CUSTOMER_1_USERNAME: ${ZITADEL_CUSTOMER_1_USERNAME:?copy .env.example to .env and set ZITADEL_CUSTOMER_1_USERNAME}
      ZITADEL_CUSTOMER_1_EMAIL: ${ZITADEL_CUSTOMER_1_EMAIL:?copy .env.example to .env and set ZITADEL_CUSTOMER_1_EMAIL}
      ZITADEL_CUSTOMER_1_PASSWORD: ${ZITADEL_CUSTOMER_1_PASSWORD:?copy .env.example to .env and set ZITADEL_CUSTOMER_1_PASSWORD}
      ZITADEL_CUSTOMER_2_USERNAME: ${ZITADEL_CUSTOMER_2_USERNAME:?copy .env.example to .env and set ZITADEL_CUSTOMER_2_USERNAME}
      ZITADEL_CUSTOMER_2_EMAIL: ${ZITADEL_CUSTOMER_2_EMAIL:?copy .env.example to .env and set ZITADEL_CUSTOMER_2_EMAIL}
      ZITADEL_CUSTOMER_2_PASSWORD: ${ZITADEL_CUSTOMER_2_PASSWORD:?copy .env.example to .env and set ZITADEL_CUSTOMER_2_PASSWORD}
      ZITADEL_ADMIN_USERNAME: ${ZITADEL_ADMIN_USERNAME:?copy .env.example to .env and set ZITADEL_ADMIN_USERNAME}
      ZITADEL_ADMIN_EMAIL: ${ZITADEL_ADMIN_EMAIL:?copy .env.example to .env and set ZITADEL_ADMIN_EMAIL}
      ZITADEL_ADMIN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?copy .env.example to .env and set ZITADEL_ADMIN_PASSWORD}
      ZITADEL_K6_CLIENT_SECRET: ${ZITADEL_K6_CLIENT_SECRET:?copy .env.example to .env and set ZITADEL_K6_CLIENT_SECRET}
    entrypoint: ["node", "/app/zitadel-init.mjs"]
    volumes:
      - ./infrastructure/zitadel/zitadel-init.mjs:/app/zitadel-init.mjs:ro
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks:
      - zitadel
    depends_on:
      zitadel-api:
        condition: service_healthy
    restart: "no"

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.1.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for topic in inventory.reservation.requests inventory.reservation.results; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1
        done
    restart: "no"

  otel-lgtm:
    image: grafana/otel-lgtm:0.30.0
    container_name: otel-lgtm
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning/dashboards/custom.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.4
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs-init:
    image: amazon/aws-cli:2.27.31
    container_name: rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cat > /tmp/bucket-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": "*",
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::products/*"]
            }
          ]
        }
        POLICY
        aws --endpoint-url http://rustfs:9000 s3 mb s3://products || true
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket products --policy file:///tmp/bucket-policy.json
    restart: "no"

  inventory-postgres:
    container_name: inventory-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: password  # pragma: allowlist secret
      POSTGRES_DB: inventory
    ports:
      - "15432:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
      - ./services/inventory/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory:
    container_name: inventory
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    ports:
      - "18081:8080"
    environment:
      DATABASE_URL: postgres://inventory:password@inventory-postgres:5432/inventory?sslmode=disable  # pragma: allowlist secret
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_REQUEST_TOPIC: inventory.reservation.requests
      KAFKA_RESULT_TOPIC: inventory.reservation.results
      KAFKA_CONSUMER_GROUP: inventory-service
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: products
      RUSTFS_ACCESS_KEY_ID: rustfsadmin
      RUSTFS_SECRET_ACCESS_KEY: rustfsadmin  # pragma: allowlist secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: inventory
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-ec,deployment.environment=local
    depends_on:
      inventory-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully

  order-db:
    image: postgres:17-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: password  # pragma: allowlist secret
      POSTGRES_DB: order
    volumes:
      - order-db-data:/var/lib/postgresql/data
      - ./services/order/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build: ./services/order
    container_name: order-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      order-db:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://order:password@order-db:5432/order  # pragma: allowlist secret
      KAFKA_BROKERS: kafka:9092
      KAFKA_REQUEST_TOPIC: inventory.reservation.requests
      KAFKA_RESULT_TOPIC: inventory.reservation.results
      KAFKA_CONSUMER_GROUP: order-service
      CORS_ORIGINS: http://localhost:3001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: order
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=sample-ec,deployment.environment=local
    ports:
      - "8081:8080"

  storefront:
    build:
      context: ./frontends/storefront
      dockerfile: Dockerfile
    container_name: storefront
    ports:
      - "3001:80"
    depends_on:
      - inventory
      - order-service

  admin:
    build:
      context: ./frontends/admin
      dockerfile: Dockerfile
    container_name: admin
    ports:
      - "3002:80"
    depends_on:
      - inventory

volumes:
  kafka-data:
  inventory_postgres_data:
  order-db-data:
  rustfs-data:
  rustfs-logs:
  zitadel-postgres-data:
  zitadel-bootstrap:

networks:
  zitadel:
    name: sample-ec-service-zitadel
