repos:
  # Common
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-merge-conflict

  # Secrets detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: pnpm-lock\.yaml$

  # Project quality checks. These use the tools and configurations already used
  # by Makefile/CI, and are limited to the component that contains staged files.
  - repo: local
    hooks:
      - id: gofmt
        name: Go format (gofmt)
        entry: gofmt -w
        language: system
        types: [go]
        files: ^services/inventory/
      - id: golangci-lint
        name: Go lint (golangci-lint)
        entry: bash -c 'cd services/inventory && golangci-lint run ./...'
        language: system
        files: ^services/inventory/.*\.go$
        pass_filenames: false
      - id: ruff-format
        name: Python format (ruff)
        entry: ruff format
        language: system
        types: [python]
        files: ^services/order/
      - id: ruff-check
        name: Python lint (ruff)
        entry: ruff check
        language: system
        types: [python]
        files: ^services/order/
      - id: admin-prettier
        name: Admin format (Prettier)
        entry: bash -c 'files=("$@"); set --; for file in "${files[@]}"; do set -- "$@" "${file#frontends/admin/}"; done; cd frontends/admin && pnpm exec prettier --write "$@"' --
        language: system
        files: ^frontends/admin/.*\.(?:[cm]?[jt]sx?|json|css|md|ya?ml)$
      - id: admin-eslint
        name: Admin lint (ESLint)
        entry: bash -c 'files=("$@"); set --; for file in "${files[@]}"; do set -- "$@" "${file#frontends/admin/}"; done; cd frontends/admin && pnpm exec eslint "$@"' --
        language: system
        files: ^frontends/admin/.*\.[cm]?[jt]sx?$
      - id: storefront-prettier
        name: Storefront format (Prettier)
        entry: bash -c 'files=("$@"); set --; for file in "${files[@]}"; do set -- "$@" "${file#frontends/storefront/}"; done; cd frontends/storefront && pnpm exec prettier --write "$@"' --
        language: system
        files: ^frontends/storefront/.*\.(?:[cm]?[jt]sx?|json|css|md|ya?ml)$
      - id: storefront-eslint
        name: Storefront lint (ESLint)
        entry: bash -c 'files=("$@"); set --; for file in "${files[@]}"; do set -- "$@" "${file#frontends/storefront/}"; done; cd frontends/storefront && pnpm exec eslint "$@"' --
        language: system
        files: ^frontends/storefront/.*\.[cm]?[jt]sx?$
