# Disposable E2E environment; no published ports or production volumes.
services:
  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    extends:
      file: ../../compose.yaml
      service: kafka
    container_name: analytics-e2e-kafka
    ports: !reset []
  kafka-init:
    extends:
      file: ../../compose.yaml
      service: kafka-init
    container_name: analytics-e2e-kafka-init
  rustfs:
    extends:
      file: ../../compose.yaml
      service: rustfs
    container_name: analytics-e2e-rustfs
    ports: !reset []
  analytics-object-storage-init:
    extends:
      file: ../../compose.analytics.yaml
      service: analytics-object-storage-init
  analytics-catalog-init:
    extends:
      file: ../../compose.analytics.yaml
      service: analytics-catalog-init
  analytics-rest:
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    extends:
      file: ../../compose.analytics.yaml
      service: analytics-rest
    ports: !reset []
  analytics-trino:
    mem_limit: 1g
    extends:
      file: ../../compose.analytics.yaml
      service: analytics-trino
    ports: !reset []
  analytics-namespace-init:
    extends:
      file: ../../compose.analytics.yaml
      service: analytics-namespace-init
  flink-jobmanager:
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        state.checkpoints.num-retained: 3
        taskmanager.numberOfTaskSlots: 2
    extends:
      file: ../../compose.flink.yaml
      service: flink-jobmanager
    ports: !reset []
  flink-taskmanager:
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
    extends:
      file: ../../compose.flink.yaml
      service: flink-taskmanager
  order-db:
    extends:
      file: ../../compose.yaml
      service: order-db
    container_name: analytics-e2e-order-db
  kafka-connect:
    extends:
      file: ../../compose.yaml
      service: kafka-connect
    ports: !reset []
  order-outbox-init:
    extends:
      file: ../../compose.yaml
      service: order-outbox-init
  inventory-postgres:
    extends:
      file: ../../compose.yaml
      service: inventory-postgres
    container_name: analytics-e2e-inventory-postgres
    ports: !reset []
  redis:
    extends:
      file: ../../compose.yaml
      service: redis
    container_name: analytics-e2e-redis
    ports: !reset []
  inventory:
    extends:
      file: ../../compose.yaml
      service: inventory
    container_name: analytics-e2e-inventory
    ports: !reset []
    networks: !override [default]
    volumes: !override
      - ./bootstrap.json:/test/bootstrap.json:ro
    environment:
      ZITADEL_BOOTSTRAP_CONFIG: /test/bootstrap.json
      OTEL_SDK_DISABLED: 'true'
    depends_on: !override
      inventory-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  order-service:
    extends:
      file: ../../compose.yaml
      service: order-service
    container_name: analytics-e2e-order-service
    ports: !reset []
    networks: !override [default]
    volumes: !override
      - ./order_app.py:/app/e2e_app.py:ro
    command: [python, e2e_app.py]
    environment:
      OTEL_SDK_DISABLED: 'true'
    depends_on: !override
      order-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      inventory:
        condition: service_started
volumes:
  kafka-data:
  rustfs-data:
  rustfs-logs:
  analytics-catalog-data:
  flink-checkpoints:
  order-db-data:
  inventory_postgres_data:
