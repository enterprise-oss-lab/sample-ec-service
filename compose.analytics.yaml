services:
  analytics-object-storage-init:
    image: amazon/aws-cli:2.27.31
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin # pragma: allowlist secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket analytics 2>/dev/null ||
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket analytics
    restart: "no"

  analytics-catalog-init:
    image: alpine:3.21.3
    command: ["chown", "-R", "1000:1000", "/var/lib/iceberg"]
    volumes:
      - analytics-catalog-data:/var/lib/iceberg
    restart: "no"

  analytics-rest:
    image: apache/iceberg-rest-fixture:1.8.1
    depends_on:
      analytics-object-storage-init:
        condition: service_completed_successfully
      analytics-catalog-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin # pragma: allowlist secret
      AWS_REGION: us-east-1
      CATALOG_CATALOG_NAME: analytics
      CATALOG_WAREHOUSE: s3://analytics/
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/catalog.db?journal_mode=WAL
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:18181:8181"
    volumes:
      - analytics-catalog-data:/var/lib/iceberg
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  analytics-trino:
    image: trinodb/trino:483
    depends_on:
      analytics-rest:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ANALYTICS_TRINO_PORT:-28080}:8080"
    volumes:
      - ./analytics/trino/catalog:/etc/trino/catalog:ro
      - ./analytics/trino/smoke.sql:/opt/analytics/smoke.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/v1/info >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  analytics-catalog-data:
    name: sample-ec-analytics-catalog-data
